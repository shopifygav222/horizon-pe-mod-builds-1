# Horizon PE's mod builds (worker.js). Setting it up: README.md beside this file.
name = "horizon-pe-mod-builds-1"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# The repository whose `mod-build` workflow builds the app: this one, or your fork.
REPO = "shopifygav222/horizon-pocket-edition-ios"
# How many builds one device may start in a day, how many everyone may, and how many mods a build
# takes. A build a player asks for that exists already is found, not started, and counts for nothing.
PER_DEVICE_PER_DAY = "8"
PER_DAY = "300"
MAX_MODS = "28"

# The counters (they expire by themselves). No id: Cloudflare creates the store on the first
# deploy, from the Deploy button and from `npx wrangler deploy` alike.
[[kv_namespaces]]
binding = "LIMITS"

# The token is a secret, never in this file: the Deploy button asks for it (.dev.vars.example),
# and from a computer it is `npx wrangler secret put GITHUB_TOKEN`.
